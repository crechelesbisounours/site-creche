titre: "Grandir ensemble, parents et professionnelles main dans la main"
introduction: "Une crèche associative de 32 places à Rosporden, qui accueille les enfants de 10 semaines à 4 ans. Les familles participent à la vie de la structure aux côtés d'une équipe de professionnelles de la petite enfance."
